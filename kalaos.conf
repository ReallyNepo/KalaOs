# KalaOS Configuration - Source of Truth
# Edita esto y re-ejecuta ./install.sh para iterar
# Valores por defecto optimizados para gaming + Hyprland + Ghostty

# ── Kernel & Boot ──────────────────────────────────────────────
KERNEL_VARIANT="cachyos-bore"          # cachyos-bore | cachyos-eevdf | linux-zen
KERNEL_CMDLINE="nvme.noacpi=1 mitigations=off transparent_hugepage=always nowatchdog"
BOOTLOADER="systemd-boot"              # systemd-boot | grub | refind

# ── Hardware ───────────────────────────────────────────────────
GPU_VENDOR="auto"                      # auto | nvidia | amd | intel | hybrid
NVIDIA_DRIVER="auto"                   # auto | nvidia-open-dkms | nvidia-dkms | nvidia-lts-dkms
ENABLE_VULKAN_LAYERS=true              # mangohud, goverlay, vkbasalt, VKD3D

# ── Gaming Stack ───────────────────────────────────────────────
ENABLE_GAMING=true
GAMESCOPE_SESSION=true                 # Sesión gamescope (Steam Deck style)
PROTON_VARIANT="GE-Proton"             # GE-Proton | proton-experimental | proton-hotfix
STEAM_DECK_UI=false                    # Habilitar deck UI mode

# ── Desktop (Hyprland) ─────────────────────────────────────────
HYPRLAND_ANIMATIONS=true
HYPRLAND_BLUR=true
HYPRLAND_GAPS=true
HYPRLAND_ROUNDING=8
WORKSPACE_COUNT=10

# ── Terminal (Ghostty) ─────────────────────────────────────────
TERMINAL="ghostty"
GHOSTTY_THEME="kalaos-purple-red"      # Tema custom con syntax highlighting IDE-like
SHELL="fish"
ENABLE_ATUIN=true
ENABLE_STARSHIP=true

# ── Theming ────────────────────────────────────────────────────
THEME_BASE="purple-red"                # Tu combo base morado/rojo
THEME_MODE="dark"                      # dark | light | auto
WALLPAPER_AUTO_COLOR=true              # Extraer palette del wallpaper (matugen/wallust)
GTK_THEME="kalaos-gtk"
ICON_THEME="kalaos-icons"
CURSOR_THEME="bibata-modern-amber"

# ── Fonts ──────────────────────────────────────────────────────
FONT_UI="SF Pro Display"               # macOS San Francisco
FONT_MONO="JetBrains Mono Nerd Font"   # Mono para terminal/código
FONT_PIXEL="KalaPixel"                 # Tu pixel font para logo/UI elements

# ── Login ──────────────────────────────────────────────────────
LOGIN_MANAGER="lightdm"
AUTOLOGIN_USER=""                      # Vacío = sin autologin

# ── Debloat ────────────────────────────────────────────────────
DEBLOAT_LEVEL="aggressive"             # minimal | standard | aggressive
REMOVE_LOCALES_KEEP=("en_US" "es_ES")
REMOVE_DOCS=true
REMOVE_MAN_PAGES=true

# ── Performance ────────────────────────────────────────────────
ZRAM_SIZE_PERCENT=75
ZRAM_COMPRESSION="zstd"
CPU_GOVERNOR="performance"
ENABLE_IRQBALANCE=true
ENABLE_PREEMPT_RT=false                # Si querés kernel RT

# ── Branding ───────────────────────────────────────────────────
DISTRO_NAME="KalaOS"
DISTRO_TAGLINE="Arch-based. Cat-powered. Game-ready."
LOGO_STYLE="pixel-cat-arch"
BOOTSPLASH=true

# ── Extras ─────────────────────────────────────────────────────
EXTRA_PACKAGES=()
CUSTOM_REPOS=("chaotic-aur")