<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- KalaOS Cat-Arch Logo - ASCII Art Style -->
  <!-- Colors: Red #B84038 (main), Purple #8A6BD8 (accent), Dark #1C1520, Light #E8E0F0 -->

  <defs>
    <!-- Muted red gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B84038;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C85048;stop-opacity:1" />
    </linearGradient>
    <!-- Muted purple gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7A5BC8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6BD8;stop-opacity:1" />
    </linearGradient>
    <!-- Pattern for ASCII-style texture -->
    <pattern id="asciiTexture" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#241830"/>
      <text x="4" y="6" font-family="monospace" font-size="6" fill="#3A2A50" text-anchor="middle">█</text>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#1C1520"/>

  <!-- ASCII-style grid background (subtle) -->
  <g opacity="0.15">
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#4A3A60" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="32" stroke="#4A3A60" stroke-width="0.5"/>
    </pattern>
    <rect width="512" height="512" fill="url(#grid)"/>
  </g>

  <!-- Main Arch Triangle - RED gradient -->
  <polygon points="256,50 470,462 42,462" fill="url(#redGrad)" stroke="#C85048" stroke-width="3"/>

  <!-- Inner highlight triangle -->
  <polygon points="256,90 430,432 82,432" fill="none" stroke="#D86058" stroke-width="1" opacity="0.4"/>

  <!-- Cat Ears LEFT - Red with purple inner -->
  <polygon points="110,200 160,70 210,200" fill="url(#redGrad)" stroke="#C85048" stroke-width="2"/>
  <polygon points="125,185 160,100 195,185" fill="url(#purpleGrad)" opacity="0.9"/>

  <!-- Cat Ears RIGHT - Red with purple inner -->
  <polygon points="302,200 352,70 402,200" fill="url(#redGrad)" stroke="#C85048" stroke-width="2"/>
  <polygon points="317,185 352,100 387,185" fill="url(#purpleGrad)" opacity="0.9"/>

  <!-- Whiskers LEFT - ASCII style (dotted) -->
  <g stroke="#C85048" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3">
    <line x1="160" y1="270" x2="70" y2="255"/>
    <line x1="160" y1="295" x2="60" y2="295"/>
    <line x1="160" y1="320" x2="70" y2="335"/>
  </g>

  <!-- Whiskers RIGHT - ASCII style (dotted) -->
  <g stroke="#C85048" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3">
    <line x1="352" y1="270" x2="442" y2="255"/>
    <line x1="352" y1="295" x2="452" y2="295"/>
    <line x1="352" y1="320" x2="442" y2="335"/>
  </g>

  <!-- Eyes - ASCII block style (purple accent) -->
  <rect x="182" y="245" width="36" height="40" rx="4" fill="#8A6BD8" opacity="0.95"/>
  <rect x="294" y="245" width="36" height="40" rx="4" fill="#8A6BD8" opacity="0.95"/>

  <!-- Pupils -->
  <rect x="194" y="255" width="12" height="20" rx="2" fill="#1C1520"/>
  <rect x="306" y="255" width="12" height="20" rx="2" fill="#1C1520"/>

  <!-- Eye highlight (ASCII sparkle) -->
  <text x="198" y="265" font-family="monospace" font-size="10" fill="#E8E0F0">*</text>
  <text x="310" y="265" font-family="monospace" font-size="10" fill="#E8E0F0">*</text>

  <!-- Nose - red -->
  <polygon points="256,310 248,325 264,325" fill="#B84038"/>

  <!-- Mouth - ASCII style -->
  <path d="M 256 325 Q 256 340 236 340 M 256 325 Q 256 340 276 340"
        stroke="#B84038" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ASCII whisker marks on cheeks -->
  <g stroke="#8A6BD8" stroke-width="1" opacity="0.5">
    <line x1="140" y1="285" x2="120" y2="275"/>
    <line x1="140" y1="305" x2="118" y2="305"/>
    <line x1="140" y1="325" x2="120" y2="335"/>
    <line x1="372" y1="285" x2="392" y2="275"/>
    <line x1="372" y1="305" x2="394" y2="305"/>
    <line x1="372" y1="325" x2="392" y2="335"/>
  </g>

  <!-- KALA text - ASCII block letters -->
  <g font-family="monospace" font-weight="bold" fill="#E8E0F0">
    <text x="256" y="440" font-size="32" text-anchor="middle" letter-spacing="12">KALA</text>
    <text x="256" y="470" font-size="14" text-anchor="middle" fill="#8A6BD8">OS</text>
  </g>

  <!-- ASCII corner decorations -->
  <g font-family="monospace" font-size="16" fill="#8A6BD8" opacity="0.4">
    <text x="30" y="60">╔═╗</text>
    <text x="450" y="60">╔═╗</text>
    <text x="30" y="480">╚═╝</text>
    <text x="450" y="480">╚═╝</text>
  </g>

  <!-- Version tag ASCII -->
  <text x="256" y="500" font-family="monospace" font-size="10" fill="#5A4A7A" text-anchor="middle">[ KalaOS v1.0 ]</text>
</svg>