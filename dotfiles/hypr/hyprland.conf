# KalaOS Hyprland Config - Omarchy-style keybindings + gaming optimizations
# Colors loaded from ~/.config/hypr/colors-hyprland.conf (generated by theming module)

source = ~/.config/hypr/colors-hyprland.conf

# ─── Monitor ───────────────────────────────────────────────────
monitor = ,preferred,auto,auto

# ─── Animations ────────────────────────────────────────────────
animation = bezier, 0.05, 0.9, 0.1, 1.05
animation = easeOutExpo, 1, -10, 45
animation = easeInOutBack, 1, 10, -10

# ─── General ───────────────────────────────────────────────────
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba($accent_purple) rgba($accent_red) 45deg
    col.inactive_border = rgba($border)
    layout = dwindle
    allow_tearing = false
    no_cursor_warps = false
    cursor_inactive_timeout = 300
}

# ─── Decoration ────────────────────────────────────────────────
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = false
    }
    drop_shadow = true
    shadow_range = 12
    shadow_render_power = 3
    col.shadow = rgba(000000aa)
}

# ─── Misc ──────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    vrr = 1
    enable_swallow = true
    swallow_regex = ^(kitty|ghostty|alacritty|foot)$
    force_default_wallpaper = 0
    animate_manual_removes = true
}

# ─── Input (Omarchy-style) ─────────────────────────────────────
input {
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options = caps:escape_shifted_capslock
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
    sensitivity = 0
    accel_profile = flat
}

# ─── Gestures ──────────────────────────────────────────────────
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
}

# ─── Window Rules ──────────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor|gnome-calculator|file-roller)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = noblur, class:^(gamescope|steam|Steam)$
windowrulev2 = opacity 0.95, class:^(ghostty|kitty|alacritty|foot)$
windowrulev2 = size 800 600, class:^(pavucontrol|blueman-manager)$
windowrulev2 = center, class:^(pavucontrol|blueman-manager|nm-connection-editor)$

# Gaming rules
windowrulev2 = fullscreen, class:^(steam_app_.*|lutris|heroic)$
windowrulev2 = immediate, class:^(gamescope|steam)$
windowrulev2 = noanim, class:^(gamescope|steam)$

# ─── Keybindings (Omarchy-style) ───────────────────────────────
$mainMod = SUPER
$altMod = ALT
$shift = SHIFT
$ctrl = CTRL
$terminal = ghostty
$launcher = rofi -show drun
$kalaos_launcher = rofi -show kalaos -modes "kalaos:~/.config/rofi/kalaos-launcher.sh"
$powermenu = wlogout
$screenshot = grimblast save area
$screenshot_full = grimblast save screen

# Apps
bind = $mainMod, Return, exec, $terminal
bind = $mainMod $shift, Return, exec, $terminal -e fish -c 'kala config edit'
bind = $mainMod, D, exec, $launcher
bind = $mainMod $shift, D, exec, wofi --show drun
bind = $mainMod, space, exec, $kalaos_launcher
bind = $mainMod, E, exec, ghostty -e yazi
bind = $mainMod $shift, E, exec, nautilus
bind = $mainMod, B, exec, firefox
bind = $mainMod $shift, B, exec, ghostty -e nvim

# Window management
bind = $mainMod, Q, killactive,
bind = $mainMod $shift, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod $shift, F, fullscreen, 1
bind = $mainMod, V, togglefloating,
bind = $mainMod $shift, V, togglefloating, all
bind = $mainMod, S, pseudo,
bind = $mainMod $shift, S, pseudo, all
bind = $mainMod $shift, space, togglesplit,

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod $shift, left, movewindow, l
bind = $mainMod $shift, right, movewindow, r
bind = $mainMod $shift, up, movewindow, u
bind = $mainMod $shift, down, movewindow, d

# Resize
bind = $mainMod $ctrl, left, resizeactive, -50 0
bind = $mainMod $ctrl, right, resizeactive, 50 0
bind = $mainMod $ctrl, up, resizeactive, 0 -50
bind = $mainMod $ctrl, down, resizeactive, 0 50

# Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod $shift, 1, movetoworkspace, 1
bind = $mainMod $shift, 2, movetoworkspace, 2
bind = $mainMod $shift, 3, movetoworkspace, 3
bind = $mainMod $shift, 4, movetoworkspace, 4
bind = $mainMod $shift, 5, movetoworkspace, 5
bind = $mainMod $shift, 6, movetoworkspace, 6
bind = $mainMod $shift, 7, movetoworkspace, 7
bind = $mainMod $shift, 8, movetoworkspace, 8
bind = $mainMod $shift, 9, movetoworkspace, 9
bind = $mainMod $shift, 0, movetoworkspace, 10

# Workspace navigation
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod $shift, Tab, workspace, e-1
bind = $mainMod, grave, workspace, special:scratchpad
bind = $mainMod $shift, grave, movetoworkspace, special:scratchpad

# Special workspace (scratchpad)
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod $shift, grave, movetoworkspace, special:scratchpad

# Screenshots
bind = , Print, exec, $screenshot
bind = $shift, Print, exec, $screenshot_full
bind = $ctrl, Print, exec, grimblast copy area
bind = $ctrl $shift, Print, exec, grimblast copy screen

# Audio
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media keys
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Power menu
bind = $mainMod $shift, Escape, exec, $powermenu

# Reload Hyprland
bind = $mainMod $shift, R, reload,
bind = $mainMod $ctrl, R, killall hyprland; exec hyprland

# Gaming: Gamescope toggle
bind = $mainMod, G, exec, gamescope -W 1920 -H 1080 -r 144 -f -- steam

# ─── Cursor ────────────────────────────────────────────────────
cursor {
    no_hardware_cursors = false
    zoom_factor = 1.0
}

# ─── Autogenerated (do not edit manually) ──────────────────────
# Workspace rules
workspace = 1, default:true
workspace = 2, default:true
workspace = 3, default:true
workspace = 4, default:true
workspace = 5, default:true
workspace = 6, default:true
workspace = 7, default:true
workspace = 8, default:true
workspace = 9, default:true
workspace = 10, default:true

# ─── Environment variables ─────────────────────────────────────
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = BEMENU_BACKEND,wayland
env = GTK_THEME,kalaos-gtk
env = ICON_THEME,kalaos-icons
env = CURSOR_THEME,bibata-modern-amber
env = CURSOR_SIZE,24